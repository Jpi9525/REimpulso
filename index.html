<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>ReImpulso – prototipo funcional</title>
<style>
/*
VOICE: tranquila, respetuosa, de usted; frases cortas.
IDEA: una ventanilla de atención amable: un paso a la vez, con quien le explica qué sigue.
PICTURE: la propia herramienta, con botones grandes y avisos claros.
COLOUR and TYPE: verde profundo, blanco y dorado para avisos; letra grande y clara.
LAYOUT: barra superior con Letra, Ayuda y Mi cuenta; 5 botones fijos abajo en celular, a la izquierda en computadora.
*/
:root{
  --verde:#0f5a47; --verde-osc:#0b3d31; --verde-claro:#e8f3ed; --verde-medio:#cfe5d9;
  --tinta:#15211d; --gris:#4a5551; --linea:#c2cdc8; --fondo:#f4f6f4; --blanco:#fff;
  --oro:#9a6a0c; --oro-claro:#fff5df; --rojo:#a3241b; --rojo-claro:#fcebe9; --azul:#1d4f91; --azul-claro:#e9f0fa;
  --radio:16px; --base:19px;
}
html{font-size:var(--base)}
html.t2{--base:22px} html.t3{--base:25px}
html.contraste{--verde:#003b2c;--verde-osc:#000;--gris:#1b1b1b;--linea:#3a3a3a;--fondo:#fff;--verde-claro:#fff;--tinta:#000;--oro:#5c3d00}
html.contraste .tarjeta,html.contraste .aviso,html.contraste input,html.contraste select,html.contraste textarea{border-width:2px;border-color:#000}
*{box-sizing:border-box;min-width:0}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--tinta);background:var(--fondo);line-height:1.55;font-size:1rem}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:500;line-height:1.2;margin:0 0 .4em;color:var(--verde-osc)}
html.contraste h1,html.contraste h2,html.contraste h3{color:#000}
h1{font-size:1.85rem} h2{font-size:1.4rem} h3{font-size:1.15rem}
p{margin:.3em 0 .8em}
a{color:var(--verde)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
svg{flex:none}
:focus-visible{outline:4px solid var(--oro);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:54px;padding:.6em 1.2em;border-radius:12px;border:2px solid var(--verde);background:var(--verde);color:#fff;font-weight:700;text-decoration:none;text-align:center;line-height:1.25}
.btn:hover{background:var(--verde-osc)}
.btn.sec{background:#fff;color:var(--verde)}
.btn.sec:hover{background:var(--verde-claro)}
.btn.peligro{background:#fff;color:var(--rojo);border-color:var(--rojo)}
.btn.chico{min-height:48px;padding:.4em .9em;font-size:.95rem}
.btn.ancho{width:100%}
.btn:disabled{opacity:.6;cursor:not-allowed}
/* barra superior */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.5rem;padding:.55rem 1rem;background:#fff;border-bottom:1px solid var(--linea)}
.logo{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.25rem;color:var(--verde);text-decoration:none;margin-right:auto}
.logo span.m{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--verde);color:#fff;font-size:1.5rem;line-height:1}
.topbar .btn{min-height:48px;padding:.3em .8em;font-size:.95rem;white-space:nowrap}
/* estructura */
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 64px)}
nav.lado{background:#fff;border-right:1px solid var(--linea);padding:1rem .7rem;display:flex;flex-direction:column;gap:.35rem}
nav.lado button{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:.75rem .85rem;color:var(--tinta);font-weight:700;min-height:56px}
nav.lado button[aria-current="page"]{background:var(--verde);color:#fff}
nav.lado button:hover:not([aria-current="page"]){background:var(--verde-claro)}
nav.lado .quien{padding:.4rem .8rem 1rem;border-bottom:1px solid var(--linea);margin-bottom:.4rem}
nav.lado .quien small{color:var(--gris);font-size:.9rem}
nav.lado .sh{display:none}
.badge{display:inline-grid;place-items:center;min-width:1.6em;height:1.6em;padding:0 .4em;border-radius:99px;background:var(--rojo);color:#fff;font-size:.8rem;margin-left:auto}
main{padding:1.6rem clamp(1rem,3vw,2.5rem) 5rem;max-width:960px;width:100%}
.intro{color:var(--gris);font-size:1.05rem;margin-top:-.1rem;margin-bottom:1.2rem}
.tarjeta{background:#fff;border:1px solid var(--linea);border-radius:var(--radio);padding:1.2rem 1.3rem;margin-bottom:1.1rem}
.aviso{display:flex;gap:.9rem;align-items:flex-start;border-radius:var(--radio);padding:1rem 1.2rem;margin-bottom:1.1rem;background:var(--verde-claro);border:1px solid var(--verde-medio)}
.aviso.alerta{background:var(--rojo-claro);border-color:#eec0ba}
.aviso.info{background:var(--azul-claro);border-color:#c6d6ee}
.aviso.oro{background:var(--oro-claro);border-color:#ecd7a6}
.ico{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--verde);color:#fff}
.aviso.alerta .ico{background:var(--rojo)} .aviso.info .ico{background:var(--azul)} .aviso.oro .ico{background:var(--oro)}
.aviso .btn{margin-top:.6rem}
/* accesos grandes del inicio */
.grandes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9rem;margin-bottom:1.4rem}
.grande{display:flex;flex-direction:column;align-items:flex-start;gap:.4rem;text-align:left;background:#fff;border:2px solid var(--verde-medio);border-radius:var(--radio);padding:1.1rem 1.1rem 1rem;min-height:130px;color:var(--tinta)}
.grande:hover{border-color:var(--verde);background:var(--verde-claro)}
.grande .gi{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:var(--verde);color:#fff}
.grande b{font-size:1.1rem}
.grande span{color:var(--gris);font-size:.95rem}
.resumen{font-size:1.1rem;background:#fff;border-left:6px solid var(--verde);border-radius:8px;padding:.8rem 1rem;margin-bottom:1.2rem}
/* guía */
details.guia{background:#fff;border:2px dashed var(--verde-medio);border-radius:var(--radio);margin-bottom:1.2rem}
details.guia summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:.6rem;padding:.9rem 1.1rem;font-weight:700;color:var(--verde);min-height:54px}
details.guia summary::-webkit-details-marker{display:none}
details.guia summary::after{content:"Ver";margin-left:auto;font-size:.9rem;border:2px solid var(--verde);border-radius:8px;padding:.1rem .6rem}
details.guia[open] summary::after{content:"Ocultar"}
details.guia ol{margin:0;padding:0 1.2rem 1rem 3rem}
details.guia li{margin:.35rem 0}
/* tarjeta de trabajo */
.vac .quien-pub{font-weight:700;color:var(--verde);display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.vac h3{font-size:1.3rem;margin:.35rem 0 .5rem}
.datos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.3rem 1.2rem;margin:.6rem 0;padding:0;list-style:none}
.datos li{display:flex;flex-direction:column}
.datos li span{font-size:.85rem;color:var(--gris);font-weight:700}
.datos li b{font-weight:600}
.queda{display:inline-flex;align-items:center;gap:.4rem;font-weight:700;border-radius:10px;padding:.25rem .7rem;font-size:.95rem}
.queda.q1{background:var(--verde);color:#fff} .queda.q2{background:var(--verde-claro);color:var(--verde);border:1px solid var(--verde-medio)} .queda.q3{background:var(--fondo);color:var(--gris);border:1px solid var(--linea)}
.pie{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;border-top:1px solid var(--linea);padding-top:.9rem;margin-top:.6rem}
.pago{font-weight:800;font-size:1.25rem}
.acciones{display:flex;gap:.6rem;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;margin:.4rem 0}
.chip{display:inline-flex;align-items:center;gap:.3rem;background:var(--fondo);border:1px solid var(--linea);border-radius:8px;padding:.15rem .6rem;font-size:.9rem;font-weight:600}
.chip.ok{background:var(--verde-claro);border-color:var(--verde-medio);color:var(--verde)}
.chip.pend{background:var(--oro-claro);border-color:#ecd7a6;color:#6b4a06}
.chip.no{background:var(--rojo-claro);border-color:#eec0ba;color:var(--rojo)}
/* filtros rápidos */
.rapidos{display:flex;flex-wrap:wrap;gap:.6rem;margin:.8rem 0}
.rapidos button{min-height:50px;padding:.4rem 1rem;border-radius:99px;border:2px solid var(--verde);background:#fff;color:var(--verde);font-weight:700}
.rapidos button[aria-pressed="true"]{background:var(--verde);color:#fff}
details.mas summary{cursor:pointer;font-weight:700;color:var(--verde);padding:.5rem 0;min-height:48px;display:flex;align-items:center}
.filtros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
/* formularios */
label{display:block;font-weight:700;margin-bottom:.35rem}
input,select,textarea{width:100%;min-height:56px;padding:.65rem .9rem;border:2px solid var(--linea);border-radius:12px;background:#fff;color:var(--tinta)}
textarea{min-height:120px}
input:focus,select:focus,textarea:focus{border-color:var(--verde);outline:none;box-shadow:0 0 0 3px var(--verde-medio)}
.campo{margin-bottom:1.1rem}
.campo .ayuda{color:var(--gris);font-size:.92rem;margin-top:.3rem}
.campo .error{display:flex;gap:.4rem;color:var(--rojo);font-weight:700;font-size:.95rem;margin-top:.35rem}
.check{display:flex;gap:.7rem;align-items:flex-start;font-weight:500}
.check input{width:28px;min-height:28px;height:28px;flex:none;margin-top:.1rem;accent-color:var(--verde)}
.opciones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.opciones label{display:flex;align-items:center;gap:.6rem;border:2px solid var(--linea);border-radius:12px;padding:.55rem .8rem;font-weight:600;margin:0;min-height:54px;background:#fff}
.opciones label:has(input:checked){border-color:var(--verde);background:var(--verde-claro)}
.opciones input{width:26px;min-height:26px;height:26px;accent-color:var(--verde)}
fieldset{border:0;padding:0;margin:0 0 1.1rem}
legend{font-weight:700;margin-bottom:.5rem;padding:0}
.seccion{font-family:Georgia,serif;font-size:1.2rem;color:var(--verde-osc);margin:1.2rem 0 .6rem;display:flex;gap:.6rem;align-items:center}
.seccion i{font-style:normal;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--verde);color:#fff;font-family:system-ui,sans-serif;font-size:1rem;font-weight:800}
/* acceso */
.acceso{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);min-height:calc(100vh - 64px)}
.acceso .izq{background:var(--verde-osc);color:#fff;padding:3rem clamp(1.5rem,5vw,4rem);display:flex;flex-direction:column;justify-content:center}
.acceso .izq h1{font-size:clamp(2.1rem,4vw,3.2rem);color:#fff}
.acceso .izq ul{list-style:none;padding:0;margin:1.4rem 0}
.acceso .izq li{display:flex;gap:.7rem;align-items:center;margin:.7rem 0;font-weight:600;font-size:1.05rem}
.acceso .izq li i{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#a9dcc5;color:var(--verde-osc)}
.tel{border:1px solid #6aa892;border-radius:14px;padding:1rem;display:flex;gap:.8rem;align-items:center}
.acceso .der{padding:2.2rem clamp(1.2rem,5vw,4rem);background:#fff}
.paso-t{font-size:.95rem;font-weight:700;color:var(--verde);margin:0 0 .3rem}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem;margin-bottom:1.3rem}
.rol{display:flex;gap:.8rem;align-items:center;text-align:left;padding:1rem;border:2px solid var(--linea);border-radius:14px;background:#fff;min-height:84px;color:var(--tinta)}
.rol[aria-pressed="true"]{border-color:var(--verde);background:var(--verde-claro);box-shadow:inset 0 0 0 2px var(--verde)}
.rol .ini{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:var(--verde);color:#fff;flex:none}
.rol b{font-size:1.05rem}
.rol small{color:var(--gris);font-size:.9rem}
.tabs{display:flex;border-bottom:2px solid var(--linea);margin-bottom:1.3rem}
.tabs button{flex:1;background:none;border:0;padding:.8rem;font-weight:700;color:var(--gris);border-bottom:5px solid transparent;margin-bottom:-2px;min-height:56px;font-size:1.05rem}
.tabs button[aria-selected="true"]{color:var(--verde);border-color:var(--verde)}
.pasos{display:flex;gap:.5rem;margin-bottom:.6rem}
.pasos span{flex:1;height:10px;border-radius:9px;background:var(--linea)}
.pasos span.on{background:var(--verde)}
/* progreso de solicitud */
.progreso{margin:.7rem 0}
.progreso .t{display:flex;justify-content:space-between;gap:.5rem;font-weight:700;flex-wrap:wrap}
.progreso .t span{color:var(--gris);font-weight:600}
.barra{height:14px;background:var(--fondo);border:1px solid var(--linea);border-radius:9px;overflow:hidden;margin-top:.35rem}
.barra i{display:block;height:100%;background:var(--verde)}
.sigue{display:flex;gap:.7rem;background:var(--oro-claro);border:1px solid #ecd7a6;border-radius:12px;padding:.8rem 1rem;margin:.7rem 0}
.sigue b{display:block}
/* modal */
.velo{position:fixed;inset:0;background:rgba(10,30,24,.6);display:grid;place-items:center;z-index:50;padding:1rem}
.modal{outline:none;background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:1.4rem 1.5rem 1.6rem}
.modal .cerrar{display:flex;margin:0 0 .6rem auto}
.menu-cuenta{display:grid;gap:.6rem}
.menu-cuenta .btn{justify-content:flex-start;text-align:left}
.menu-cuenta hr{border:0;border-top:1px solid var(--linea);margin:.5rem 0}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:1rem 1.3rem;border-radius:14px;z-index:60;width:min(92vw,560px);font-weight:600;font-size:1.05rem;box-shadow:0 8px 28px rgba(0,0,0,.28);display:flex;gap:.7rem;align-items:center}
/* mensajes */
.chat{display:grid;grid-template-columns:290px minmax(0,1fr);gap:1rem}
.conv{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:.9rem;margin-bottom:.5rem;color:var(--tinta);min-height:64px}
.conv[aria-current="true"]{border:2px solid var(--verde);background:var(--verde-claro)}
.burbujas{height:380px;overflow:auto;display:flex;flex-direction:column;gap:.6rem;padding:.9rem;background:var(--fondo);border-radius:14px;margin-bottom:.8rem}
.bur{max-width:82%;padding:.7rem 1rem;border-radius:16px;background:#fff;border:1px solid var(--linea)}
.bur.yo{align-self:flex-end;background:var(--verde);color:#fff;border-color:var(--verde)}
.bur.sis{align-self:center;background:var(--oro-claro);border-color:#ecd7a6;font-size:.95rem;max-width:95%}
.bur small{display:block;opacity:.8;font-size:.8rem;margin-top:.2rem}
.linea{display:flex;gap:.5rem}
.estrellas{display:flex;gap:.2rem}
.estrellas button{background:none;border:0;padding:.1rem;min-height:56px;min-width:56px;color:#bdbdbd}
.estrellas button.on{color:var(--oro)}
.est{color:var(--oro);letter-spacing:.05em}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.65rem .5rem;border-bottom:1px solid var(--linea);vertical-align:top}
th{color:var(--gris);font-weight:700;width:38%}
.contrato{border:2px solid var(--verde);border-radius:14px;padding:1.2rem;background:#fcfffd}
.contrato .resumen-c{background:var(--verde-claro);border-radius:10px;padding:.8rem 1rem;margin-bottom:1rem}
.sr{position:absolute;left:-9999px}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.lado{position:fixed;bottom:0;left:0;right:0;z-index:30;flex-direction:row;gap:0;padding:.25rem .2rem calc(.25rem + env(safe-area-inset-bottom));border-right:0;border-top:2px solid var(--linea);box-shadow:0 -4px 16px rgba(0,0,0,.08)}
  nav.lado .quien{display:none}
  nav.lado button{flex:1;flex-direction:column;justify-content:center;gap:.2rem;padding:.35rem 0;min-height:66px;text-align:center;border-radius:10px;line-height:1.15;position:relative}
  nav.lado .lg{display:none}
  nav.lado .sh{display:block;font-size:13.5px;white-space:nowrap;letter-spacing:-.01em}
  nav.lado .badge{position:absolute;top:.2rem;right:calc(50% - 1.9rem);margin:0}
  main{padding-bottom:8rem}
  .acceso{grid-template-columns:minmax(0,1fr)}
  .acceso .izq{padding:1.6rem 1.2rem}
  .acceso .izq h1{font-size:1.9rem}
  .grandes,.filtros,.roles{grid-template-columns:minmax(0,1fr)}
  .grande{min-height:0;flex-direction:row;align-items:center}
  .chat{grid-template-columns:minmax(0,1fr)}
  .datos{grid-template-columns:minmax(0,1fr)}
  .pie .acciones,.pie .acciones .btn{width:100%}
  .topbar{padding:.45rem .5rem;gap:.3rem}
  .topbar .btn{padding:.25em .5em;min-height:48px;gap:.3em}
  .logo span.m{width:34px;height:34px}
}
@media (max-width:470px){
  .logo .txt{display:none}
  .opciones{grid-template-columns:minmax(0,1fr)}
  .topbar .btn{font-size:15px}
  .topbar .btn svg{width:20px;height:20px}
}
@media (prefers-reduced-motion:no-preference){ .btn,.grande,nav.lado button{transition:background .15s} }
</style>
</head>
<body>
<header class="topbar">
  <a href="#" class="logo" id="logo" aria-label="ReImpulso, ir al inicio"><span class="m" aria-hidden="true">+</span><span class="txt">ReImpulso</span></a>
  <button class="btn sec" id="bTexto" aria-label="Cambiar el tamaño de la letra"><b>Aa</b><span>Letra</span></button>
  <button class="btn sec" id="bAyuda"><span id="icAyuda"></span><span>Ayuda</span></button>
  <button class="btn" id="bCuenta" hidden><span id="icCuenta"></span><span>Mi cuenta</span></button>
</header>
<div id="app"></div>
<div id="vivo" class="sr" aria-live="polite"></div>
<script>
"use strict";
{
/* ================= Íconos (dibujados, sin emojis) ================= */
const RUTAS = {
  inicio:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',

  mensaje:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  persona:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
  mas:'<path d="M12 5v14M5 12h14"/>',
  maletin:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2"/><path d="M3 12h18"/>',
  grupo:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.3-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.8"/><path d="M17.5 14.5c2.2.3 3.6 2 4 4.5"/>',
  estrella:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
  ayuda:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><path d="M12 17h.01"/>',
  telefono:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  salir:'<path d="M15 4h4v16h-4"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h10"/>',
  reiniciar:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  alerta:'<path d="M12 3l10 18H2z"/><path d="M12 10v4"/><path d="M12 17.5h.01"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><path d="M12 7.5h.01"/>',

  if(v.modalidad === "Remoto") p += 25;

  if(u.modalidad === "Cualquiera" || u.modalidad === v.modalidad) p += 15;

  else if(/1[5-9]:00|Tarde/i.test(v.horario) && u.disponibilidad === "Tardes") p += 10;
  else if(/Flexible/i.test(v.horario) || u.disponibilidad === "Cualquier horario") p += 10;

  return Math.max(10, Math.min(99, p));

  const err = k => e[k] ? `<div class="error">${ic("alerta", 20)}<span>${esc(e[k])}</span></div>` : "";
  let form;

    form = `<h2>Entrar a su cuenta</h2><p class="intro">Escriba el correo y la contraseña con los que se registró.</p>

      <div class="campo"><label for="cCorreo">Correo electrónico</label><input id="cCorreo" type="email" autocomplete="email" placeholder="ejemplo: nombre@correo.com" value="${esc(b.correo || "")}">${err("correo")}</div>
      <div class="campo"><label for="cPass">Contraseña</label><div class="linea"><input id="cPass" type="password" autocomplete="current-password"><button type="button" class="btn sec" id="verPass">Mostrar</button></div>${err("pass")}</div>
      <button class="btn ancho">Entrar ${ic("flecha")}</button>
    </form>
    <p style="margin-top:1rem">¿Olvidó su contraseña? Llámenos gratis al <b>800 734 6785</b> y le ayudamos.</p>`;
  } else if(ui.paso === 1){
    form = `<p class="paso-t">Paso 1 de 2</p><div class="pasos"><span class="on"></span><span></span></div>
    <h2>Crear cuenta</h2><p class="intro">${emp ? "Cuéntenos quién va a contratar." : "Sus datos básicos. Le tomará unos minutos."}</p>
    ${emp ? `<p style="font-weight:700;margin:.2rem 0 .5rem">¿Cómo va a contratar?</p><div class="roles">
      <button type="button" class="rol" data-tipo="particular" aria-pressed="${part}"><span class="ini">${ic("persona")}</span><span><b>Como persona</b><br><small>Para mi casa, mi familia o mi negocio pequeño</small></span></button>
      <button type="button" class="rol" data-tipo="empresa" aria-pressed="${!part}"><span class="ini">${ic("maletin")}</span><span><b>Como empresa</b><br><small>Negocio o institución con RFC</small></span></button></div>` : ""}
    <form id="fPaso1" novalidate>
      <div class="campo"><label for="rNombre">${emp && !part ? "Nombre de la empresa" : "Su nombre completo"}</label><input id="rNombre" value="${esc(b.nombre || "")}" autocomplete="name">${err("nombre")}</div>
      ${emp && !part ? `<div class="campo"><label for="rRfc">RFC de la empresa</label><input id="rRfc" value="${esc(b.rfc || "")}" maxlength="13" style="text-transform:uppercase"><div class="ayuda">Son 12 o 13 letras y números. Ejemplo: DCH150312AB4</div>${err("rfc")}</div>`
             : part ? `<div class="aviso info"><span class="ico">${ic("info")}</span><div>Como persona no necesita RFC. Después le pediremos una foto de su INE para verificar que es usted.</div></div>`
             : `<div class="campo"><label for="rEdad">Su edad</label><input id="rEdad" type="number" inputmode="numeric" min="18" max="110" value="${esc(b.edad || "")}">${err("edad")}</div>`}
      <div class="campo"><label for="rTel">Su número de celular</label><input id="rTel" inputmode="tel" value="${esc(b.tel || "")}" placeholder="ejemplo: 229 123 4567"><div class="ayuda">Son 10 números.</div>${err("tel")}</div>
      <div class="campo"><label for="rCorreo">Su correo electrónico</label><input id="rCorreo" type="email" value="${esc(b.correo || "")}" placeholder="ejemplo: nombre@correo.com">${err("correo")}</div>
      <button class="btn ancho">Continuar al paso 2 ${ic("flecha")}</button>
    </form>`;
  } else {
    form = `<p class="paso-t">Paso 2 de 2</p><div class="pasos"><span class="on"></span><span class="on"></span></div>
    <h2>Crear cuenta</h2><p class="intro">${emp ? "Dónde está y su contraseña." : "Lo que sabe hacer nos ayuda a mostrarle los trabajos que mejor le quedan."}</p>
    <form id="fPaso2" novalidate>
      <div class="campo"><label for="rMun">¿En qué municipio ${emp ? "está" : "vive"}?</label><select id="rMun">${MUNICIPIOS.map(m => `<option ${b.municipio === m ? "selected" : ""}>${m}</option>`).join("")}</select></div>
      ${part ? "" : emp ? `<div class="campo"><label for="rGiro">¿A qué se dedica la empresa?</label><input id="rGiro" value="${esc(b.giro || "")}" placeholder="ejemplo: venta de ropa">${err("giro")}</div>`
            : `<fieldset><legend>¿Qué sabe hacer? Marque una o varias.</legend>
                <div class="opciones">${HABILIDADES.map(h => `<label><input type="checkbox" name="hab" value="${h}" ${(b.habilidades || []).includes(h) ? "checked" : ""}> ${h}</label>`).join("")}</div>${err("hab")}</fieldset>
               <div class="campo"><label for="rMod">¿Dónde prefiere trabajar?</label><select id="rMod">${[["Cualquiera","En persona o desde casa"],["Presencial","En persona"],["Remoto","Desde casa"]].map(([v, t]) => `<option value="${v}">${t}</option>`).join("")}</select></div>`}
      <div class="campo"><label for="rPass">Invente una contraseña</label><input id="rPass" type="password" autocomplete="new-password"><div class="ayuda">Debe tener al menos 8 letras o números, y por lo menos un número. Anótela en un lugar seguro.</div>${err("pass")}</div>
      <div class="campo"><label class="check"><input type="checkbox" id="rPriv"> Acepto el aviso de privacidad: mis datos solo se usan para ${emp ? "encontrar a personas que trabajen conmigo" : "encontrarme trabajo"} y nunca se venden.</label>${err("priv")}</div>
      <div class="acciones"><button type="button" class="btn sec" id="atras">Regresar</button><button class="btn" style="flex:1">Crear mi cuenta</button></div>
    </form>`;
  }
  return `<div class="acceso">
    <section class="izq">
      <h1>Tu experiencia sigue abriendo puertas.</h1>
      <p style="font-size:1.1rem">Trabajos cortos cerca de casa o desde casa para personas de 60 a 75 años. Y una forma segura de contratar a alguien con experiencia.</p>
      <ul><li><i>${ic("check", 18)}</i>Todos se verifican con INE o RFC</li><li><i>${ic("check", 18)}</i>El pago se guarda hasta terminar el trabajo</li><li><i>${ic("check", 18)}</i>Ayuda por teléfono en cada paso</li></ul>
      <div class="tel"><span class="ico" style="background:#a9dcc5;color:#0b3d31">${ic("telefono")}</span><div><b>¿Prefiere que le ayudemos por teléfono?</b><br>Llámenos gratis al 800 734 6785</div></div>
    </section>
    <section class="der">
      <p style="font-weight:700;margin-top:0;font-size:1.1rem">Primero, díganos qué quiere hacer:</p>
      <div class="roles">
        <button class="rol" data-rol="trabajador" aria-pressed="${!emp}"><span class="ini">${ic("buscar")}</span><span><b>Busco trabajo</b><br><small>Soy trabajador</small></span></button>
        <button class="rol" data-rol="empresa" aria-pressed="${emp}"><span class="ini">${ic("grupo")}</span><span><b>Quiero contratar</b><br><small>Como persona o como empresa</small></span></button>
      </div>
      <div class="tabs" role="tablist"><button role="tab" data-tab="entrar" aria-selected="${ui.pestaña === "entrar"}">Ya tengo cuenta</button><button role="tab" data-tab="crear" aria-selected="${ui.pestaña === "crear"}">Soy nuevo</button></div>
      ${form}
    </section></div>`;
}

/* ---------- Marco con los 5 botones del menú ---------- */
function menu(u){
  const emp = u.rol === "empresa";
  const noLeidos = conversaciones(u).filter(c => c.nuevo).length;
  const nuevas = emp ? solicitudesDe(u).filter(p => ["Enviada", "En revisión"].includes(p.estado)).length : 0;
  const items = emp
    ? [["inicio", "inicio", "Inicio", "Inicio"], ["publicar", "mas", "Publicar un trabajo", "Publicar"], ["misvacantes", "maletin", "Mis trabajos", "Trabajos"], ["postulados", "grupo", "Interesados", "Personas", nuevas], ["mensajes", "mensaje", "Mensajes", "Mensajes", noLeidos]]
    : [["inicio", "inicio", "Inicio", "Inicio"], ["vacantes", "buscar", "Buscar trabajo", "Trabajos"], ["postulaciones", "lista", "Mis solicitudes", "Solicitudes"], ["mensajes", "mensaje", "Mensajes", "Mensajes", noLeidos], ["perfil", "persona", "Mi perfil", "Perfil"]];
  return `<nav class="lado" aria-label="Menú principal">
    <div class="quien"><b>${esc(u.nombre)}</b><br><small>${emp ? (esPart(u) ? "Contrata como persona" : "Empresa") : "Trabajador"} · ${esc(u.municipio)}</small></div>
    ${items.map(([k, i, t, c, n]) => `<button data-ir="${k}" ${ui.vista === k ? 'aria-current="page"' : ""} aria-label="${t}">${ic(i, 26)}<span class="lg">${t}</span><span class="sh">${c}</span>${n ? `<span class="badge" aria-label="${n} nuevos">${n}</span>` : ""}</button>`).join("")}
  </nav>`;
}
function marco(u){
  const vistas = u.rol === "empresa"
    ? {inicio:inicioEmp, publicar:publicar, misvacantes:misVacantes, postulados:postulados, mensajes:mensajes, perfil:perfilEmp, resenas:resenas}
    : {inicio:inicioTrab, vacantes:vacantes, postulaciones:misPostulaciones, mensajes:mensajes, perfil:perfilTrab, resenas:resenas};
  if(!vistas[ui.vista]) ui.vista = "inicio";
  return `<div class="layout">${menu(u)}<main id="main" tabindex="-1">${vistas[ui.vista](u)}</main></div>`;
}

/* ---------- Tarjeta de un trabajo ---------- */
function tarjetaVac(v, u){
  const e = usuario(v.empresaId), c = compatibilidad(u, v);
  const ya = db.postulaciones.find(p => p.vacId === v.id && p.trabId === u.id);
  return `<article class="tarjeta vac">
    <div class="quien-pub">${esc(e.nombre)}${esPart(e) ? " (persona)" : ""} ${sello(e)}</div>
    <h3>${esc(v.titulo)}</h3>
    ${queda(c)}
    <ul class="datos">
      <li><span>Dónde</span><b>${esc(MODALIDAD[v.modalidad])}${v.modalidad === "Remoto" ? "" : ", " + esc(v.municipio)}</b></li>
      <li><span>Horario</span><b>${esc(v.horario)}</b></li>
      <li><span>Cuánto dura</span><b>${esc(v.plazo)}</b></li>
      <li><span>Esfuerzo físico</span><b>${esc(v.esfuerzo)}</b></li>
    </ul>
    <div class="pie"><div><span class="pago">${dinero(v.pago)}</span><br><span style="color:var(--gris);font-size:.92rem">por todo el trabajo · publicado ${hace(v.fecha)}</span></div>
      <div class="acciones"><button class="btn sec" data-detalle="${v.id}">Ver más</button>
      ${ya ? `<button class="btn" disabled>${ic("check")} Ya envió su solicitud</button>` : `<button class="btn" data-postular="${v.id}">Me interesa</button>`}</div></div>
  </article>`;
}

/* ---------- Trabajador ---------- */
function inicioTrab(u){
  const activas = db.vacantes.filter(v => v.estado === "activa");
  const recom = activas.map(v => [v, compatibilidad(u, v)]).sort((a, b) => b[1] - a[1]);
  const mias = db.postulaciones.filter(p => p.trabId === u.id && !["Terminada", "No seleccionada"].includes(p.estado));
  const noLeidos = conversaciones(u).filter(c => c.nuevo).length;
  const porFirmar = mias.filter(p => p.estado === "Aceptada" && !p.contrato.firmaTrab).length;
  const falta = ["identidad", "telefono"].filter(k => u.verif[k] !== "ok").map(k => k === "telefono" ? "su teléfono" : "su INE");
  const partes = [];
  const todas = db.postulaciones.filter(p => p.trabId === u.id).length;
  partes.push(mias.length ? `Tiene <b>${mias.length} ${mias.length === 1 ? "solicitud" : "solicitudes"} en proceso</b>` : todas ? "No tiene solicitudes en proceso ahora" : "Todavía no ha enviado solicitudes");
  if(noLeidos) partes.push(`<b>${noLeidos} ${noLeidos === 1 ? "mensaje nuevo" : "mensajes nuevos"}</b>`);
  return `<h1>Hola, ${esc(pnombre(u))}</h1>${intro("¿Qué quiere hacer hoy? Toque uno de los botones.")}
  ${falta.length ? `<div class="aviso alerta"><span class="ico">${ic("alerta")}</span><div><b>Le falta verificar ${falta.join(" y ")}.</b><br>Es necesario para poder firmar un contrato. Solo toma unos minutos.<br><button class="btn chico" data-ir="perfil">Verificar ahora</button></div></div>`
    : `<div class="aviso"><span class="ico">${ic("escudo")}</span><div><b>Su cuenta está verificada.</b><br>Quienes contratan pueden confiar en usted.</div></div>`}
  ${porFirmar ? `<div class="aviso oro"><span class="ico">${ic("firma")}</span><div><b>¡Lo aceptaron en un trabajo!</b><br>Tiene un contrato esperando su firma.<br><button class="btn chico" data-ir="postulaciones">Ir a firmar</button></div></div>` : ""}
  <div class="grandes">
    <button class="grande" data-ir="vacantes"><span class="gi">${ic("buscar")}</span><span><b>Buscar trabajo</b><br><span>${recom.filter(r => r[1] >= 50).length} trabajos le quedan bien</span></span></button>
    <button class="grande" data-ir="postulaciones"><span class="gi">${ic("lista")}</span><span><b>Mis solicitudes</b><br><span>Vea en qué paso va cada una</span></span></button>
    <button class="grande" data-ir="mensajes"><span class="gi">${ic("mensaje")}</span><span><b>Mensajes</b><br><span>${noLeidos ? noLeidos + " sin leer" : "Platique con quien contrata"}</span></span></button>
  </div>
  <p class="resumen">${partes.join(" y ")}.</p>
  <h2>Trabajos que le recomendamos</h2>${intro("Los elegimos por lo que sabe hacer, dónde vive y su horario.")}
  ${recom.slice(0, 2).map(r => tarjetaVac(r[0], u)).join("")}
  <button class="btn sec ancho" data-ir="vacantes">Ver todos los trabajos ${ic("flecha")}</button>`;
}
function vacantes(u){
  const f = ui.filtros;
  let lista = db.vacantes.filter(v => v.estado === "activa").map(v => [v, compatibilidad(u, v)]);
  const q = f.q.trim().toLowerCase();
  if(q) lista = lista.filter(([v]) => (v.titulo + " " + v.descripcion + " " + v.etiquetas.join(" ") + " " + usuario(v.empresaId).nombre).toLowerCase().includes(q));
  if(f.cerca === "cerca") lista = lista.filter(([v]) => v.modalidad !== "Remoto" && (v.municipio === u.municipio || (CONURBADA.includes(u.municipio) && CONURBADA.includes(v.municipio))));
  if(f.cerca === "casa") lista = lista.filter(([v]) => v.modalidad === "Remoto");
  if(f.mun !== "Todas") lista = lista.filter(([v]) => v.municipio === f.mun);
  if(f.plazo !== "Cualquiera") lista = lista.filter(([v]) => v.plazo === f.plazo);
  lista.sort((a, b) => b[1] - a[1]);
  const masAbierto = f.mun !== "Todas" || f.plazo !== "Cualquiera";
  return `<h1>Trabajos</h1>${intro("Trabajos cortos de empresas y personas verificadas. Primero aparecen los que mejor le quedan.")}
  ${guia("¿Cómo me postulo a un trabajo?", ["Lea el trabajo. Si quiere saber más, toque <b>«Ver más»</b>; ahí también puede escucharlo en voz alta.", "Si le interesa, toque <b>«Me interesa»</b> y confirme.", "Revise en <b>«Mis solicitudes»</b> en qué paso va. Le avisaremos cuando le respondan."])}
  <div class="tarjeta">
    <label for="fQ">Buscar por palabra</label><input id="fQ" value="${esc(f.q)}" placeholder="ejemplo: costura, clases, recepción">
    <div class="rapidos" role="group" aria-label="Mostrar">
      ${[["todos", "Todos"], ["cerca", "Cerca de mí"], ["casa", "Desde casa"]].map(([k, t]) => `<button data-cerca="${k}" aria-pressed="${f.cerca === k}">${t}</button>`).join("")}
    </div>
    <details class="mas" ${masAbierto ? "open" : ""}><summary>Más opciones para filtrar</summary>
      <div class="filtros">
        <div><label for="fMun">Municipio</label><select id="fMun">${["Todas", ...MUNICIPIOS].map(m => `<option value="${m}" ${f.mun === m ? "selected" : ""}>${m === "Todas" ? "Todos" : m}</option>`).join("")}</select></div>
        <div><label for="fPlazo">Cuánto dura</label><select id="fPlazo">${["Cualquiera", "Unas horas", "1 día", "1 semana", "1 mes", "3 meses"].map(m => `<option ${f.plazo === m ? "selected" : ""}>${m}</option>`).join("")}</select></div>
      </div>
    </details>
  </div>
  <p style="font-size:1.1rem"><b>${lista.length} ${lista.length === 1 ? "trabajo encontrado" : "trabajos encontrados"}</b></p>
  ${lista.length ? lista.map(([v]) => tarjetaVac(v, u)).join("") : `<div class="tarjeta"><p>No encontramos trabajos con esa búsqueda.</p><button class="btn sec" id="limpiar">Ver todos los trabajos</button></div>`}`;
}
function siguienteTexto(p, emp){
  const c = p.contrato || {};
  if(emp) return ({
    "Enviada":"Revise el perfil. Si le convence, toque «Aceptar a esta persona».",
    "En revisión":"Revise el perfil. Si le convence, toque «Aceptar a esta persona».",
    "Aceptada": c.firmaEmp ? "Usted ya firmó. Falta que la persona firme el contrato." : "Lea el contrato y fírmelo.",
    "Contrato firmado":"Deposite el pago para que la persona pueda empezar. Lo guardamos hasta que el trabajo se termine.",
    "En curso":"Cuando el trabajo esté hecho, toque «El trabajo ya se terminó» para entregar el pago.",
    "Terminada": p.calEmp ? "Trabajo terminado. Gracias por usar ReImpulso." : "Trabajo terminado. Califique a la persona.",
    "No seleccionada":"Le avisamos amablemente que eligió a otra persona."})[p.estado];
  return ({
    "Enviada":"Espere la respuesta. Le avisaremos aquí y en Mensajes.",
    "En revisión":"Están revisando su perfil. Si le piden algo, lo verá en Mensajes.",
    "Aceptada": c.firmaTrab ? "Usted ya firmó. Falta que firme quien le contrata." : "Lea el contrato y fírmelo con el botón verde.",
    "Contrato firmado":"Quien le contrata debe depositar el pago. Cuando lo haga, puede empezar a trabajar.",
    "En curso":"El pago ya está guardado. Haga el trabajo como se acordó; al terminar recibirá su dinero.",
    "Terminada": p.calTrab ? "¡Listo! Ya recibió su pago. Gracias por calificar." : "¡Listo! Ya recibió su pago. Califique cómo le fue.",
    "No seleccionada":"Esta vez eligieron a otra persona. No se desanime: hay más trabajos esperándole."})[p.estado];
}
function progreso(p, emp){
  if(p.estado === "No seleccionada") return `<p><span class="chip no">${emp ? "No seleccionada" : "Eligieron a otra persona"}</span></p>`;
  const i = ESTADOS.indexOf(p.estado);
  return `<div class="progreso"><div class="t">Paso ${i + 1} de ${ESTADOS.length}: ${(emp ? NOMBRE_C : NOMBRE_T)[p.estado]}</div>
    <div class="barra" role="progressbar" aria-valuemin="1" aria-valuemax="${ESTADOS.length}" aria-valuenow="${i + 1}"><i style="width:${(i + 1) / ESTADOS.length * 100}%"></i></div></div>`;
}
function bloqueSigue(p, emp){ return `<div class="sigue">${ic("flecha")}<div><b>¿Qué sigue?</b>${esc(siguienteTexto(p, emp))}</div></div>`; }
function accionesContrato(p, u){
  const emp = u.rol === "empresa", c = p.contrato;
  if(!c) return "";
  let h = "";
  if(p.estado === "Aceptada" && ((emp && !c.firmaEmp) || (!emp && !c.firmaTrab))) h += `<button class="btn" data-firmar="${p.id}">${ic("firma")} Leer y firmar el contrato</button>`;
  else h += `<button class="btn sec" data-contrato="${p.id}">Ver el contrato</button>`;
  if(emp && p.estado === "Contrato firmado") h += `<button class="btn" data-depositar="${p.id}">${ic("dinero")} Depositar el pago</button>`;
  if(emp && p.estado === "En curso") h += `<button class="btn" data-terminar="${p.id}">${ic("check")} El trabajo ya se terminó</button>`;
  if(p.estado === "Terminada" && ((emp && !p.calEmp) || (!emp && !p.calTrab))) h += `<button class="btn" data-calificar="${p.id}">${ic("estrella")} Calificar</button>`;
  return h;
}
function misPostulaciones(u){
  const mias = db.postulaciones.filter(p => p.trabId === u.id).sort((a, b) => b.fecha - a.fecha);
  return `<h1>Mis solicitudes</h1>${intro("Aquí ve en qué paso va cada trabajo que pidió y qué tiene que hacer después.")}
  ${guia("¿Cuáles son los pasos?", ["Usted envía su solicitud.", "Quien contrata la revisa.", "Si le aceptan, los dos firman un contrato.", "Quien contrata deposita el pago y nosotros lo guardamos.", "Usted hace el trabajo.", "Al terminar, recibe su pago y se califican."])}
  ${mias.length ? mias.map(p => { const v = vacante(p.vacId), e = usuario(v.empresaId); return `<article class="tarjeta">
    <div class="quien-pub" style="font-weight:700;color:var(--verde)">${esc(e.nombre)}${esPart(e) ? " (persona)" : ""}</div>
    <h3 style="font-size:1.25rem;margin:.3rem 0">${esc(v.titulo)}</h3>
    <p style="color:var(--gris);margin:0">Pago: <b style="color:var(--tinta)">${dinero(v.pago)}</b> · enviada ${hace(p.fecha)}</p>
    ${progreso(p, false)}
    ${p.estado === "En curso" ? `<div class="aviso info"><span class="ico">${ic("escudo")}</span><div><b>Su pago ya está guardado.</b><br>${esc(e.nombre)} depositó ${dinero(v.pago)}. Se lo entregamos al terminar.</div></div>` : ""}
    ${bloqueSigue(p, false)}
    <div class="acciones">${accionesContrato(p, u)}<button class="btn sec" data-chat="${p.id}">${ic("mensaje")} Escribir mensaje</button></div></article>`; }).join("")
  : `<div class="tarjeta"><p>Todavía no ha pedido ningún trabajo.</p><button class="btn" data-ir="vacantes">Buscar trabajo</button></div>`}`;
}
function perfilTrab(u){
  const {prom, n} = promedio(u.id);
  const nom = {identidad:["Su INE", "Una foto de su credencial para votar"], telefono:["Su teléfono", "Le mandamos un código por mensaje"], antecedentes:["Antecedentes", "Revisamos que no tenga problemas legales"], referencias:["Referencias", "Hablamos con personas que le conocen"]};
  const hechos = Object.values(u.verif).filter(x => x === "ok").length;
  return `<h1>Mi perfil</h1>${intro("Sus datos y su verificación. Entre más completo, más confianza le tienen.")}
  <div class="tarjeta"><h2>Verificación</h2><p>Lleva <b>${hechos} de 4</b>. Los dos primeros son necesarios para firmar contratos.</p>

/* ---------- Quien contrata ---------- */
function solicitudesDe(u){
  const ids = db.vacantes.filter(v => v.empresaId === u.id).map(v => v.id);
  return db.postulaciones.filter(p => ids.includes(p.vacId));
}

  ${pend.length ? `<div class="aviso oro"><span class="ico">${ic("flecha")}</span><div><b>Tiene ${pend.length} ${pend.length === 1 ? "contratación" : "contrataciones"} esperando que usted haga algo.</b><br><button class="btn chico" data-ir="postulados">Ver qué falta</button></div></div>` : ""}

function filaPostulado(p){

/* ---------- Mensajes ---------- */
function conversaciones(u){
  const emp = u.rol === "empresa";
  return db.postulaciones.filter(p => emp ? vacante(p.vacId).empresaId === u.id : p.trabId === u.id).map(p => {
    const ms = db.mensajes.filter(m => m.postId === p.id);
    const ult = ms[ms.length - 1];
    const visto = db.avisos[u.id + "|" + p.id] || 0;
    return {p, otro: emp ? usuario(p.trabId) : usuario(vacante(p.vacId).empresaId), ult, nuevo: !!(ult && ult.de !== u.id && ult.ts > visto)};
  }).sort((a, b) => ((b.ult && b.ult.ts) || b.p.fecha) - ((a.ult && a.ult.ts) || a.p.fecha));
}
function mensajes(u){
  const cs = conversaciones(u);
  if(!ui.conv && cs.length) ui.conv = cs[0].p.id;
  const act = cs.find(c => c.p.id === ui.conv);
  if(act){ db.avisos[u.id + "|" + act.p.id] = Date.now(); guardar(); }
  const ms = act ? db.mensajes.filter(m => m.postId === act.p.id) : [];
  return `<h1>Mensajes</h1>${intro("Platique con seguridad. Nunca comparta contraseñas, NIP ni datos de su tarjeta.")}
  ${cs.length ? `<div class="chat"><div><p style="font-weight:700;margin:.2rem 0 .5rem">Elija con quién hablar:</p>${cs.map(c => `<button class="conv" data-conv="${c.p.id}" aria-current="${c.p.id === ui.conv}"><b>${esc(c.otro.nombre)}</b>${c.nuevo ? ' <span class="badge">nuevo</span>' : ""}<br><span style="color:var(--gris);font-size:.92rem">${esc(vacante(c.p.vacId).titulo)}</span></button>`).join("")}</div>
    <div class="tarjeta"><h2 style="font-size:1.2rem;margin-bottom:.1rem">${esc(act.otro.nombre)}</h2><p style="color:var(--gris);margin-top:0">${esc(vacante(act.p.vacId).titulo)}</p>
      <div class="burbujas" id="burbujas">${ms.length ? ms.map(m => `<div class="bur ${m.de === u.id ? "yo" : m.de === "sistema" ? "sis" : ""}">${m.de === "sistema" ? "<b>Aviso de ReImpulso:</b> " : ""}${esc(m.texto)}<small>${m.de === u.id ? "Usted, " : ""}${hace(m.ts)}</small></div>`).join("") : '<div class="bur sis">Escriba el primer mensaje. Recuerde: nadie le debe pedir dinero por adelantado.</div>'}</div>
      <form id="fMsg"><label for="mTxt">Escriba su mensaje</label><div class="linea"><input id="mTxt" autocomplete="off" placeholder="Escriba aquí"><button class="btn">Enviar</button></div></form>
      <div class="acciones" style="margin-top:.8rem"><a class="btn sec chico" target="_blank" rel="noopener" href="https://wa.me/52${esc(act.otro.tel)}?text=${encodeURIComponent("Hola, le escribo por ReImpulso sobre: " + vacante(act.p.vacId).titulo)}">${ic("whatsapp")} Seguir por WhatsApp</a></div>
    </div></div>`
  : `<div class="tarjeta">Aquí aparecerán sus conversaciones cuando ${u.rol === "empresa" ? "alguien se interese en uno de sus trabajos" : "envíe una solicitud"}.</div>`}`;
}

/* ---------- Calificaciones ---------- */
function resenas(u){
  const rs = db.resenas.filter(r => r.para === u.id).sort((a, b) => b.ts - a.ts);
  const {prom, n} = promedio(u.id);
  const porCalificar = db.postulaciones.filter(p => p.estado === "Terminada" && (u.rol === "empresa" ? (vacante(p.vacId).empresaId === u.id && !p.calEmp) : (p.trabId === u.id && !p.calTrab)));
  return `<h1>Mis calificaciones</h1>${intro("Lo que opinan de usted quienes ya trabajaron con usted. Solo pueden calificar quienes trabajaron juntos.")}
  ${porCalificar.map(p => `<div class="aviso oro"><span class="ico">${ic("estrella")}</span><div><b>Tiene un trabajo por calificar:</b> ${esc(vacante(p.vacId).titulo)}<br><button class="btn chico" data-calificar="${p.id}">Calificar ahora</button></div></div>`).join("")}
  <div class="tarjeta" style="text-align:center"><b style="font-family:Georgia,serif;font-size:3rem">${n ? prom.toFixed(1) : "—"}</b><div style="font-size:1.6rem">${estrellas(Math.round(prom))}</div><p>${n ? `De 5 estrellas, con ${n} ${n === 1 ? "opinión" : "opiniones"}` : "Todavía no tiene opiniones"}</p></div>
  ${rs.map(r => `<div class="tarjeta"><b>${esc(usuario(r.de).nombre)}</b><br>${estrellas(r.estrellas)}<p style="margin:.4rem 0 .2rem;font-size:1.05rem">«${esc(r.texto)}»</p><span style="color:var(--gris);font-size:.92rem">${hace(r.ts)}</span></div>`).join("")}`;
}

/* ================= Acciones ================= */
function ir(v){ ui.vista = v; ui.errores = {}; ui.borrador = {}; render(); const m = $("#main"); m && m.focus({preventScroll:true}); }
function enlazar(){
  const app = $("#app");
  app.querySelectorAll("[data-ir]").forEach(b => b.onclick = () => ir(b.dataset.ir));
  // entrar / registro
  app.querySelectorAll("[data-rol]").forEach(b => b.onclick = () => { ui.rolAcceso = b.dataset.rol; ui.errores = {}; ui.paso = 1; render(); });
  app.querySelectorAll("[data-tipo]").forEach(b => b.onclick = () => { ui.tipoContr = b.dataset.tipo; ui.errores = {}; render(); });
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { ui.pestaña = b.dataset.tab; ui.errores = {}; ui.paso = 1; render(); });
  const vp = $("#verPass"); vp && (vp.onclick = () => { const i = $("#cPass"); i.type = i.type === "password" ? "text" : "password"; vp.textContent = i.type === "password" ? "Mostrar" : "Ocultar"; });
  const fe = $("#fEntrar"); fe && (fe.onsubmit = e => { e.preventDefault(); entrar(); });
  const f1 = $("#fPaso1"); f1 && (f1.onsubmit = e => { e.preventDefault(); paso1(); });
  const f2 = $("#fPaso2"); f2 && (f2.onsubmit = e => { e.preventDefault(); paso2(); });
  const at = $("#atras"); at && (at.onclick = () => { ui.paso = 1; ui.errores = {}; render(); });
  // trabajos
  const q = $("#fQ"); q && (q.oninput = () => { ui.filtros.q = q.value; const pos = q.selectionStart; render(); const n = $("#fQ"); n.focus(); try{ n.setSelectionRange(pos, pos); }catch(e){} });
  ["fMun:mun", "fPlazo:plazo"].forEach(s => { const [id, k] = s.split(":"); const el = $("#" + id); el && (el.onchange = () => { ui.filtros[k] = el.value; render(); const n = $("#" + id); n && n.focus(); }); });

  sistema(p.id, `${u.nombre} firmó el contrato.`);
  if(p.contrato.firmaEmp && p.contrato.firmaTrab){ p.estado = "Contrato firmado"; sistema(p.id, "Los dos ya firmaron. Falta que quien contrata deposite el pago para empezar."); }
  guardar(); cerrarModal(); render();
  toast(p.estado === "Contrato firmado" ? "Contrato firmado por los dos." : "Su firma quedó guardada. Falta que firme la otra persona.");
}
function depositar(id){
  const p = post(id), v = vacante(p.vacId);
  modal(`<h2>Depositar el pago</h2><p style="font-size:1.05rem">Guardamos el dinero y se lo entregamos a la persona cuando usted confirme que el trabajo se terminó.</p>
    <table><tbody><tr><th>Pago a la persona</th><td>${dinero(v.pago)}</td></tr><tr><th>Comisión de ReImpulso (10 %)</th><td>${dinero(Math.round(v.pago * .1))}</td></tr><tr><th>Total a pagar</th><td><b>${dinero(Math.round(v.pago * 1.1))}</b></td></tr></tbody></table>
    <p style="color:var(--gris);font-size:.95rem">En esta versión de prueba no se cobra dinero real.</p><button class="btn ancho" id="dep">${ic("dinero")} Confirmar el depósito</button>`,
    m => m.querySelector("#dep").onclick = () => { p.contrato.deposito = Date.now(); p.estado = "En curso"; sistema(p.id, `${yo().nombre} depositó ${dinero(v.pago)}. El dinero ya está guardado. ¡Puede empezar a trabajar!`); guardar(); cerrarModal(); render(); toast("El pago quedó guardado. La persona ya puede empezar."); });
}
function terminar(id){
  const p = post(id), v = vacante(p.vacId);
  preguntar(`¿El trabajo «${esc(v.titulo)}» ya quedó hecho? Le entregaremos ${dinero(v.pago)} a la persona.`, "Sí, ya se terminó", () => {
    p.contrato.liberado = Date.now(); p.estado = "Terminada"; sistema(p.id, `Trabajo terminado. Se entregaron ${dinero(v.pago)}. Ya se pueden calificar.`); guardar(); render(); calificar(id); });
}
function calificar(id){
  const p = post(id), u = yo(), emp = u.rol === "empresa";
  const otro = emp ? usuario(p.trabId) : usuario(vacante(p.vacId).empresaId);
  let est = 0;
  const textos = ["", "Mal", "Regular", "Bien", "Muy bien", "Excelente"];
  modal(`<h2>¿Cómo le fue con ${esc(otro.nombre)}?</h2><p>Toque las estrellas. 1 es mal y 5 es excelente.</p>
    <div class="estrellas" role="radiogroup" aria-label="Calificación">${[1, 2, 3, 4, 5].map(i => `<button type="button" data-e="${i}" aria-label="${i} estrellas: ${textos[i]}">${ic("estrella", 44)}</button>`).join("")}</div>
    <p id="estTxt" style="font-weight:700;min-height:1.6em"></p>
    <div class="campo"><label for="rtxt">¿Quiere agregar un comentario? (no es obligatorio)</label><textarea id="rtxt"></textarea></div><button class="btn ancho" id="env">Enviar calificación</button>`,
    m => { const bs = m.querySelectorAll("[data-e]");
      bs.forEach(b => b.onclick = () => { est = Number(b.dataset.e); bs.forEach(x => { const on = Number(x.dataset.e) <= est; x.classList.toggle("on", on); x.querySelector("svg").setAttribute("fill", on ? "currentColor" : "none"); }); m.querySelector("#estTxt").textContent = est + " de 5: " + textos[est]; });
      m.querySelector("#env").onclick = () => { if(!est) return toast("Primero toque las estrellas.");
        db.resenas.push({para:otro.id, de:u.id, estrellas:est, texto:m.querySelector("#rtxt").value.trim() || "Sin comentario.", ts:Date.now()});
        if(emp) p.calEmp = est; else p.calTrab = est; guardar(); cerrarModal(); render(); toast("¡Gracias! Su calificación ya se puede ver."); }; });
}
render();
if(yo()) bienvenida(yo());
}
</script>
</body>
</html>

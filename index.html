th,td{text-align:left;padding:.6rem;border-bottom:1px solid var(--linea);vertical-align:top}
th{font-size:.85rem;color:var(--gris)}

.contrato{border:2px solid var(--verde);border-radius:14px;padding:1.2rem;background:#fcfffd;font-size:.95rem}
.oculto{display:none!important}
.sr{position:absolute;left:-9999px}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usuario = id => db.usuarios.find(u => u.id === id);
const yo = () => db.sesion ? usuario(db.sesion) : null;
const vacante = id => db.vacantes.find(v => v.id === id);
function toast(msg){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const d = document.createElement("div"); d.className = "toast"; d.textContent = msg; document.body.appendChild(d);
  $("#vivo").textContent = msg; setTimeout(() => d.remove(), 4200);
}
function promedio(id){
  const r = db.resenas.filter(x => x.para === id);
  return r.length ? {prom:(r.reduce((a,b)=>a+b.estrellas,0)/r.length), n:r.length} : {prom:0,n:0};
}
function hace(ts){
  const m = Math.round((Date.now()-ts)/6e4);
  if(m < 60) return m <= 1 ? "hace un momento" : `hace ${m} minutos`;
  const h = Math.round(m/60); if(h < 24) return `hace ${h} h`;
  const d = Math.round(h/24); return d === 1 ? "ayer" : `hace ${d} días`;
}
function verificado(u){ return u.verif.identidad === "ok" && u.verif.telefono === "ok"; }
const esPart = u => u && u.tipo === "particular";
function contrVerif(e){ return esPart(e) ? verificado(e) : e.verificada; }
function sello(e){ return contrVerif(e) ? `<span class="chip ok" style="text-transform:none">✓ ${esPart(e)?"Persona verificada":"Empresa verificada"}</span>` : `<span class="chip pend" style="text-transform:none">${esPart(e)?"Persona":"Empresa"} por verificar</span>`; }
function compatibilidad(u, v){
  let p = 0;
  const comunes = v.etiquetas.filter(e => u.habilidades.includes(e)).length;
  p += Math.min(45, comunes * 22);
  if(v.modalidad === "Remoto") p += 25;
  else if(u.municipio === v.municipio) p += 25;
  else if(CONURBADA.includes(u.municipio) && CONURBADA.includes(v.municipio)) p += 18;
  if(u.modalidad === "Cualquiera" || u.modalidad === v.modalidad) p += 15;
  if(/9:00|10:00|Mañana/i.test(v.horario) && u.disponibilidad === "Mañanas") p += 10;
  else if(/1[5-9]:00|Tarde/i.test(v.horario) && u.disponibilidad === "Tardes") p += 10;
  else if(/Flexible/i.test(v.horario) || u.disponibilidad === "Cualquier horario") p += 10;
  if(verificado(u)) p += 5;
  return Math.max(10, Math.min(99, p));
}
function chipVerif(e){
  return e === "ok" ? '<span class="chip ok">✓ Verificado</span>' : e === "revision" ? '<span class="chip pend">En revisión</span>' : '<span class="chip no">Pendiente</span>';
}

function leer(texto){
  try{
    if(!("speechSynthesis" in window)) return toast("Su navegador no puede leer en voz alta.");
    speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(texto); u.lang = "es-MX"; u.rate = .92; speechSynthesis.speak(u);
  }catch(e){ toast("No fue posible leer en voz alta."); }
}

/* ================= Modal ================= */
function modal(html, alAbrir){
  cerrarModal();
  const v = document.createElement("div"); v.className = "velo"; v.id = "velo";
  v.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><button class="btn sec chico cerrar" data-cerrar>Cerrar ✕</button>${html}</div>`;
  v.addEventListener("click", e => { if(e.target === v || e.target.closest("[data-cerrar]")) cerrarModal(); });
  document.body.appendChild(v);
  const f = v.querySelector("input,select,textarea,.btn:not(.cerrar)") || v.querySelector(".btn"); f && f.focus();
  alAbrir && alAbrir(v);
}
function cerrarModal(){ const v = $("#velo"); v && v.remove(); }
document.addEventListener("keydown", e => { if(e.key === "Escape") cerrarModal(); });

/* ================= Render principal ================= */
function render(){
  const u = yo();
  $("#app").innerHTML = u ? marco(u) : acceso();

}

/* ---------- Marco con navegación ---------- */
function menu(u){
  const emp = u.rol === "empresa";
  const noLeidos = conversaciones(u).filter(c => c.nuevo).length;
  const items = emp
    ? [["inicio","⌂","Inicio"],["publicar","＋","Publicar vacante"],["misvacantes","☰","Mis vacantes"],["postulados","☻","Personas postuladas"],["mensajes","✉","Mensajes",noLeidos],["perfil","◉",esPart(u)?"Mi perfil":"Perfil de la empresa"],["resenas","★","Calificaciones"]]
    : [["inicio","⌂","Inicio"],["vacantes","⌕","Buscar trabajo"],["postulaciones","☰","Mis postulaciones"],["mensajes","✉","Mensajes",noLeidos],["perfil","◉","Mi perfil"],["resenas","★","Calificaciones"]];
  return `<nav class="lado" aria-label="Menú principal">
    <div class="quien"><b>${esc(u.nombre)}</b><br><small>${emp?(esPart(u)?"Cuenta para contratar (particular)":"Cuenta de empresa"):"Cuenta de trabajador"} · ${esc(u.municipio)}</small></div>
    ${items.map(([k,i,t,n]) => `<button data-ir="${k}" ${ui.vista===k?'aria-current="page"':""}><span aria-hidden="true">${i}</span>${t}${n?`<span class="badge">${n}</span>`:""}</button>`).join("")}
    <button class="salir" data-salir style="margin-top:auto"><span aria-hidden="true">⎋</span>Cerrar sesión</button>
  </nav>`;
}
function marco(u){
  const vistas = u.rol === "empresa"
    ? {inicio:inicioEmp, publicar:publicar, misvacantes:misVacantes, postulados:postulados, mensajes:mensajes, perfil:perfilEmp, resenas:resenas}
    : {inicio:inicioTrab, vacantes:vacantes, postulaciones:misPostulaciones, mensajes:mensajes, perfil:perfilTrab, resenas:resenas};
  if(!vistas[ui.vista]) ui.vista = "inicio";
  return `<div class="layout">${menu(u)}<main id="main" tabindex="-1">${vistas[ui.vista](u)}</main></div>
  <footer class="demo-pie">Prototipo funcional de ReImpulso · los datos se guardan solo en este navegador ·
  <button class="btn sec chico" data-salir>Cambiar de cuenta</button> <button class="btn sec chico" id="reiniciar">Restablecer datos de demostración</button></footer>`;
}

/* ---------- Tarjeta de vacante (trabajador) ---------- */
function tarjetaVac(v, u){
  const e = usuario(v.empresaId), c = compatibilidad(u, v);
  const post = db.postulaciones.find(p => p.vacId === v.id && p.trabId === u.id);
  return `<article class="tarjeta vac">
    <div class="fila"><div><div class="emp">${esc(esPart(e)?e.nombre+" · particular":e.nombre)} ${sello(e)}</div>
      <h3 style="margin-top:.3rem">${esc(v.titulo)}</h3></div>
      <div class="compat">${c}%<small>compatible</small></div></div>
    <p style="margin:.2rem 0">${esc(v.descripcion)}</p>
    <div class="meta">${esc(v.municipio)} · ${esc(v.modalidad)} · Contrato por ${esc(v.plazo)} · ${esc(v.horario)}</div>
    <div class="chips">${v.etiquetas.map(t=>`<span class="chip ${u.habilidades.includes(t)?"ok":""}">${esc(t)}</span>`).join("")}<span class="chip">Esfuerzo físico: ${esc(v.esfuerzo)}</span></div>
    <div class="pie"><div><span class="pago">${dinero(v.pago)}</span> <small>por el periodo completo</small><br><small class="sub">Publicada ${hace(v.fecha)}</small></div>
      <div class="acciones"><button class="btn sec" data-detalle="${v.id}">Ver detalles</button>
      ${post ? `<button class="btn" disabled>Postulación enviada</button>` : `<button class="btn" data-postular="${v.id}">Postular rápido</button>`}</div></div>
  </article>`;
}

/* ---------- Trabajador ---------- */
function inicioTrab(u){
  const activas = db.vacantes.filter(v => v.estado === "activa");
  const recom = activas.map(v => [v, compatibilidad(u,v)]).sort((a,b)=>b[1]-a[1]);
  const mias = db.postulaciones.filter(p => p.trabId === u.id && !["Terminada","No seleccionada"].includes(p.estado));
  const {prom,n} = promedio(u.id);
  const pendientes = Object.entries(u.verif).filter(([k,v]) => v !== "ok");
  return `<h1>Hola, ${esc(u.nombre.split(" ")[0])}</h1><p class="sub">Estas son las oportunidades que encontramos para usted.</p>
  ${verificado(u) && !pendientes.length ? `<div class="aviso"><span class="ico">✓</span><div><b>Su identidad está verificada.</b><br>Su perfil genera más confianza y lo ven empresas verificadas.</div></div>`
    : `<div class="aviso ${verificado(u)?"info":"alerta"}"><span class="ico">!</span><div><b>Le falta verificar: ${pendientes.map(p=>({identidad:"identidad",telefono:"teléfono",antecedentes:"antecedentes",referencias:"referencias"})[p[0]]).join(", ")}.</b><br>${verificado(u)?"Completar estos puntos le da más confianza a las empresas.":"Sin verificar identidad y teléfono no se puede firmar un contrato."} <button class="btn chico" data-ir="perfil">Verificar ahora</button></div></div>`}
  <div class="grid3">
    <div class="dato"><span>Oportunidades para usted</span><b>${recom.filter(r=>r[1]>=50).length}</b><span>con 50 % o más de compatibilidad</span></div>
    <div class="dato"><span>Postulaciones activas</span><b>${mias.length}</b><span>${mias.length?"en proceso":"todavía ninguna"}</span></div>
    <div class="dato"><span>Calificación</span><b>${n?prom.toFixed(1).replace(".",","):"—"} <span style="color:var(--oro)">★</span></b><span>${n?`basada en ${n} experiencias`:"sin experiencias aún"}</span></div>
  </div>
  <div class="fila" style="display:flex;justify-content:space-between;align-items:end"><div><h2>Recomendadas para usted</h2><p class="sub">Según su experiencia, ubicación y horario.</p></div><button class="btn sec chico" data-ir="vacantes">Ver todas</button></div>
  ${recom.slice(0,2).map(r => tarjetaVac(r[0],u)).join("")}`;
}
function vacantes(u){
  const f = ui.filtros;
  let lista = db.vacantes.filter(v => v.estado === "activa").map(v => [v, compatibilidad(u,v)]);
  const q = f.q.trim().toLowerCase();
  if(q) lista = lista.filter(([v]) => (v.titulo+" "+v.descripcion+" "+v.etiquetas.join(" ")+" "+usuario(v.empresaId).nombre).toLowerCase().includes(q));
  if(f.mun !== "Todas") lista = lista.filter(([v]) => v.municipio === f.mun || (f.mun==="Desde casa" && v.modalidad==="Remoto"));
  if(f.plazo !== "Cualquiera") lista = lista.filter(([v]) => v.plazo === f.plazo);
  if(f.mod !== "Cualquiera") lista = lista.filter(([v]) => v.modalidad === f.mod);
  lista.sort((a,b)=>b[1]-a[1]);
  return `<h1>Encuentre una oportunidad</h1><p class="sub">Trabajos temporales de empresas y personas verificadas, ordenados por compatibilidad.</p>
  <div class="tarjeta filtros">
    <div><label for="fQ">Buscar</label><input id="fQ" value="${esc(f.q)}" placeholder="Trabajo, quién contrata o habilidad"></div>
    <div><label for="fMun">Ubicación</label><select id="fMun">${["Todas",...MUNICIPIOS].map(m=>`<option ${f.mun===m?"selected":""}>${m}</option>`).join("")}</select></div>
    <div><label for="fMod">Modalidad</label><select id="fMod">${["Cualquiera","Presencial","Remoto"].map(m=>`<option ${f.mod===m?"selected":""}>${m}</option>`).join("")}</select></div>
    <div><label for="fPlazo">Plazo</label><select id="fPlazo">${["Cualquiera","Unas horas","1 día","1 semana","1 mes","3 meses"].map(m=>`<option ${f.plazo===m?"selected":""}>${m}</option>`).join("")}</select></div>
  </div>
  <p><b>${lista.length} ${lista.length===1?"oportunidad disponible":"oportunidades disponibles"}</b></p>
  ${lista.length ? lista.map(([v]) => tarjetaVac(v,u)).join("") : `<div class="tarjeta">No encontramos vacantes con esos filtros. <button class="btn sec chico" id="limpiar">Quitar filtros</button></div>`}`;
}
function lineaTiempo(p){
  if(p.estado === "No seleccionada") return `<span class="chip no">No seleccionada esta vez</span>`;
  const i = ESTADOS.indexOf(p.estado);
  return `<ol class="linea-tiempo">${ESTADOS.map((s,k)=>`<li class="${k<=i?"hecho":""}">${k<=i?"✓ ":""}${s}</li>`).join("")}</ol>`;
}
function accionesContrato(p, u){
  const emp = u.rol === "empresa", c = p.contrato;
  if(!c) return "";
  let h = `<button class="btn sec chico" data-contrato="${p.id}">Ver contrato digital</button>`;
  if(p.estado === "Aceptada" && ((emp && !c.firmaEmp) || (!emp && !c.firmaTrab))) h += `<button class="btn chico" data-firmar="${p.id}">Firmar contrato</button>`;
  if(emp && p.estado === "Contrato firmado") h += `<button class="btn chico" data-depositar="${p.id}">Depositar pago protegido</button>`;
  if(emp && p.estado === "En curso") h += `<button class="btn chico" data-terminar="${p.id}">Confirmar servicio terminado</button>`;
  if(p.estado === "Terminada" && ((emp && !p.calEmp) || (!emp && !p.calTrab))) h += `<button class="btn chico" data-calificar="${p.id}">Calificar experiencia</button>`;
  return h;
}
function misPostulaciones(u){
  const mias = db.postulaciones.filter(p => p.trabId === u.id).sort((a,b)=>b.fecha-a.fecha);

/* ---------- Empresa ---------- */
function inicioEmp(u){
  const mias = db.vacantes.filter(v => v.empresaId === u.id);
  const ids = mias.map(v=>v.id);
  const posts = db.postulaciones.filter(p => ids.includes(p.vacId));
  const {prom,n} = promedio(u.id);
  const nuevas = posts.filter(p => ["Enviada","En revisión"].includes(p.estado));
  const avisoV = esPart(u)
    ? (verificado(u) ? `<div class="aviso"><span class="ico">✓</span><div><b>Su identidad está verificada.</b><br>Su sello de persona verificada aparece en sus vacantes. Como particular no paga cuota mensual: solo 10 % por cada trabajo terminado.</div></div>`
       : `<div class="aviso alerta"><span class="ico">!</span><div><b>Verifique su INE y su teléfono.</b><br>Puede publicar vacantes, pero para aceptar a alguien y firmar el contrato necesita estar verificado. <button class="btn chico" data-ir="perfil">Verificar ahora</button></div></div>`)
    : `<div class="aviso"><span class="ico">✓</span><div><b>Empresa validada correctamente.</b><br>RFC ${esc(u.rfc)} verificado. Su sello aparece en todas sus vacantes.</div></div>`;
  return `<h1>Hola, ${esPart(u) ? esc(u.nombre.split(" ")[0]) : "equipo " + esc(u.nombre.split(" ").slice(0,2).join(" "))}</h1><p class="sub">${esPart(u)?"Publique lo que necesita y encuentre a una persona con experiencia.":"Administre sus vacantes y encuentre personas con experiencia."}</p>
  ${avisoV}
  <div class="grid3">
    <div class="dato"><span>Vacantes activas</span><b>${mias.filter(v=>v.estado==="activa").length}</b><span>de ${mias.length} publicadas</span></div>
    <div class="dato"><span>Personas por revisar</span><b>${nuevas.length}</b><span>postulaciones nuevas</span></div>
    <div class="dato"><span>Calificación</span><b>${n?prom.toFixed(1).replace(".",","):"—"} <span style="color:var(--oro)">★</span></b><span>${n} experiencias</span></div>
  </div>
  <div class="acciones" style="margin-bottom:1rem"><button class="btn" data-ir="publicar">＋ Publicar vacante</button><button class="btn sec" data-ir="postulados">Revisar postulaciones</button></div>
  <h2>Postulaciones recientes</h2>
  ${nuevas.length ? nuevas.map(p => filaPostulado(p)).join("") : `<div class="tarjeta">No tiene postulaciones nuevas por ahora.</div>`}`;
}

    <div class="aviso info"><span class="ico">i</span><div>El pago debe ser al menos proporcional al salario mínimo vigente ($315.04 por jornada de 8 horas). ReImpulso cobra 10 % sobre el pago al terminar el trabajo, a empresas y a particulares. ${esPart(u)?"Como particular no paga cuota mensual.":"Las empresas pagan además $790 + IVA al mes."}</div></div>
    <button class="btn">Publicar y avisar a candidatos</button>
  </form>`;
}

function filaPostulado(p){
  const t = usuario(p.trabId), v = vacante(p.vacId), {prom,n} = promedio(t.id), u = yo();
  return `<article class="tarjeta">
    <div class="fila" style="display:flex;justify-content:space-between;gap:1rem"><div><h3>${esc(t.nombre)}, ${t.edad} años</h3>
    <div class="meta">Para: <b>${esc(v.titulo)}</b> · ${esc(t.municipio)} · ${n?`${prom.toFixed(1)} ★ (${n})`:"sin reseñas"}</div></div>
    <div class="compat">${compatibilidad(t,v)}%<small>compatible</small></div></div>
    <p style="margin:.2rem 0">${esc(t.bio)}</p>
    <div class="chips">${t.habilidades.map(h=>`<span class="chip ${v.etiquetas.includes(h)?"ok":""}">${esc(h)}</span>`).join("")}</div>
    <div class="chips"><span>Identidad ${chipVerif(t.verif.identidad)}</span><span>Teléfono ${chipVerif(t.verif.telefono)}</span><span>Antecedentes ${chipVerif(t.verif.antecedentes)}</span></div>
    ${lineaTiempo(p)}
    <div class="acciones"><button class="btn sec chico" data-chat="${p.id}">Enviar mensaje</button>
    ${["Enviada","En revisión"].includes(p.estado)?`<button class="btn chico" data-aceptar="${p.id}">Aceptar candidato</button><button class="btn peligro chico" data-rechazar="${p.id}">No seleccionar</button>`:""}
    ${accionesContrato(p,u)}</div></article>`;
}
function postulados(u){
  const ids = db.vacantes.filter(v => v.empresaId === u.id).map(v=>v.id);
  const posts = db.postulaciones.filter(p => ids.includes(p.vacId)).sort((a,b)=>b.fecha-a.fecha);
  return `<h1>Personas postuladas</h1><p class="sub">Revise perfiles, converse y genere el contrato temporal.</p>
  ${posts.length ? posts.map(filaPostulado).join("") : `<div class="tarjeta">Aún no hay personas postuladas.</div>`}`;
}

/* ---------- Mensajes ---------- */
function conversaciones(u){
  const emp = u.rol === "empresa";
  return db.postulaciones.filter(p => emp ? vacante(p.vacId).empresaId === u.id : p.trabId === u.id).map(p => {
    const ms = db.mensajes.filter(m => m.postId === p.id);
    const ult = ms[ms.length-1];
    const visto = db.avisos[u.id+"|"+p.id] || 0;
    return {p, otro: emp ? usuario(p.trabId) : usuario(vacante(p.vacId).empresaId), ult, nuevo: !!(ult && ult.de !== u.id && ult.ts > visto)};
  }).sort((a,b)=>((b.ult&&b.ult.ts)||b.p.fecha)-((a.ult&&a.ult.ts)||a.p.fecha));
}
function mensajes(u){
  const cs = conversaciones(u);
  if(!ui.conv && cs.length) ui.conv = cs[0].p.id;
  const act = cs.find(c => c.p.id === ui.conv);
  if(act){ db.avisos[u.id+"|"+act.p.id] = Date.now(); guardar(); }
  const ms = act ? db.mensajes.filter(m => m.postId === act.p.id) : [];
  return `<h1>Mensajes</h1><p class="sub">Conversaciones protegidas: no comparta contraseñas ni datos bancarios.</p>
  ${cs.length ? `<div class="chat"><div>${cs.map(c=>`<button class="conv" data-conv="${c.p.id}" aria-current="${c.p.id===ui.conv}"><b>${esc(c.otro.nombre)}</b>${c.nuevo?' <span class="badge">nuevo</span>':""}<br><small class="sub">${esc(vacante(c.p.vacId).titulo)}</small></button>`).join("")}</div>
    <div class="tarjeta"><h3>${esc(act.otro.nombre)}</h3><div class="meta">${esc(vacante(act.p.vacId).titulo)} · ${esc(act.p.estado)}</div>
      <div class="burbujas" id="burbujas">${ms.length?ms.map(m=>`<div class="bur ${m.de===u.id?"yo":m.de==="sistema"?"sis":""}">${esc(m.texto)}<small>${hace(m.ts)}</small></div>`).join(""):'<div class="bur sis">Inicie la conversación. Recuerde: nunca pida ni envíe dinero por adelantado.</div>'}</div>
      <form id="fMsg" class="linea"><label for="mTxt" class="sr">Escriba su mensaje</label><input id="mTxt" autocomplete="off" placeholder="Escriba su mensaje"><button class="btn">Enviar</button></form>
      <div class="acciones" style="margin-top:.6rem"><a class="btn sec chico" target="_blank" rel="noopener" href="https://wa.me/52${esc(act.otro.tel)}?text=${encodeURIComponent("Hola, le escribo por ReImpulso sobre: "+vacante(act.p.vacId).titulo)}">Continuar en WhatsApp</a></div>
    </div></div>`
  : `<div class="tarjeta">Las conversaciones aparecen cuando hay una postulación.</div>`}`;
}

/* ---------- Reseñas ---------- */
function resenas(u){
  const rs = db.resenas.filter(r => r.para === u.id).sort((a,b)=>b.ts-a.ts);
  const {prom,n} = promedio(u.id);
  const dist = [5,4,3,2,1].map(s => [s, rs.filter(r=>r.estrellas===s).length]);
  const porCalificar = db.postulaciones.filter(p => p.estado==="Terminada" && (u.rol==="empresa" ? (vacante(p.vacId).empresaId===u.id && !p.calEmp) : (p.trabId===u.id && !p.calTrab)));
  return `<h1>Calificaciones y reseñas</h1><p class="sub">Solo se pueden calificar quienes trabajaron juntos.</p>
  ${porCalificar.map(p=>`<div class="aviso info"><span class="ico">★</span><div><b>Tiene una experiencia por calificar:</b> ${esc(vacante(p.vacId).titulo)}. <button class="btn chico" data-calificar="${p.id}">Calificar ahora</button></div></div>`).join("")}
  <div class="tarjeta" style="display:grid;grid-template-columns:200px 1fr;gap:1.5rem;align-items:center">
    <div style="text-align:center"><b style="font-family:Georgia;font-size:3rem">${n?prom.toFixed(1):"—"}</b><div style="color:var(--oro);font-size:1.4rem">${"★".repeat(Math.round(prom))}${"☆".repeat(5-Math.round(prom))}</div><small>${n} reseñas verificadas</small></div>
    <div>${dist.map(([s,c])=>`<div style="display:flex;gap:.6rem;align-items:center;margin:.25rem 0"><span style="width:2.5em">${s} ★</span><div class="barra"><i style="width:${n?c/n*100:0}%"></i></div><span style="width:1.5em">${c}</span></div>`).join("")}</div>
  </div>
  ${rs.map(r=>`<div class="tarjeta"><b>${esc(usuario(r.de).nombre)}</b> <span style="color:var(--oro)">${"★".repeat(r.estrellas)}</span> <span class="chip ok">Reseña verificada</span><p style="margin:.4rem 0 0">${esc(r.texto)}</p><small class="sub">${hace(r.ts)}</small></div>`).join("") || '<div class="tarjeta">Aún no tiene reseñas.</div>'}`;
}

/* ================= Acciones ================= */
function ir(v){ ui.vista = v; ui.errores = {}; ui.borrador = {}; render(); $("#main") && $("#main").focus({preventScroll:true}); }
function enlazar(){
  const app = $("#app");
  app.querySelectorAll("[data-ir]").forEach(b => b.onclick = () => ir(b.dataset.ir));
  document.querySelectorAll("[data-salir]").forEach(b => b.onclick = () => { db.sesion = null; guardar(); ui = {...ui, pestaña:"entrar", paso:1, borrador:{}, errores:{}, vista:"inicio", conv:null}; render(); });
  const rein = $("#reiniciar"); rein && (rein.onclick = () => preguntar("¿Restablecer todos los datos de demostración? Se borran las cuentas y vacantes que haya creado.", "Sí, restablecer", () => { const s = db.sesion; db = semilla(); db.sesion = usuario(s) ? s : null; guardar(); ui.vista="inicio"; ui.conv=null; render(); toast("Datos restablecidos."); }));
  // acceso
  app.querySelectorAll("[data-rol]").forEach(b => b.onclick = () => { ui.rolAcceso = b.dataset.rol; ui.errores = {}; ui.paso = 1; render(); });
  app.querySelectorAll("[data-tipo]").forEach(b => b.onclick = () => { ui.tipoContr = b.dataset.tipo; ui.errores = {}; render(); });
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { ui.pestaña = b.dataset.tab; ui.errores = {}; ui.paso = 1; render(); });
  app.querySelectorAll("[data-demo]").forEach(b => b.onclick = () => { $("#cCorreo").value = b.dataset.demo; $("#cPass").value = "demo1234"; $("#fEntrar").requestSubmit(); });
  const vp = $("#verPass"); vp && (vp.onclick = () => { const i = $("#cPass"); i.type = i.type === "password" ? "text" : "password"; vp.textContent = i.type === "password" ? "Mostrar" : "Ocultar"; });
  const fe = $("#fEntrar"); fe && (fe.onsubmit = e => { e.preventDefault(); entrar(); });
  const f1 = $("#fPaso1"); f1 && (f1.onsubmit = e => { e.preventDefault(); paso1(); });
  const f2 = $("#fPaso2"); f2 && (f2.onsubmit = e => { e.preventDefault(); paso2(); });
  const at = $("#atras"); at && (at.onclick = () => { ui.paso = 1; ui.errores = {}; render(); });
  // vacantes
  const fil = (id, k) => { const el = $(id); el && (el.oninput = () => { ui.filtros[k] = el.value; const pos = el.selectionStart; render(); const n = $(id); n.focus(); if(pos!=null && n.setSelectionRange) try{n.setSelectionRange(pos,pos);}catch(e){} }); };
  fil("#fQ","q"); fil("#fMun","mun"); fil("#fPlazo","plazo"); fil("#fMod","mod");
  const lim = $("#limpiar"); lim && (lim.onclick = () => { ui.filtros = {q:"",mun:"Todas",plazo:"Cualquiera",mod:"Cualquiera"}; render(); });
  app.querySelectorAll("[data-detalle]").forEach(b => b.onclick = () => detalle(b.dataset.detalle));
  app.querySelectorAll("[data-postular]").forEach(b => b.onclick = () => postular(b.dataset.postular));

function terminar(id){
  const p = db.postulaciones.find(x=>x.id===id), v = vacante(p.vacId);
  preguntar(`¿Confirma que el servicio «${v.titulo}» se realizó? Se liberarán ${dinero(v.pago)} a la persona.`, "Sí, el servicio terminó", () => {
    p.contrato.liberado = Date.now(); p.estado = "Terminada"; sistema(p.id, `Servicio terminado. Se liberaron ${dinero(v.pago)} a la persona. Ya pueden calificarse.`); guardar(); render(); calificar(id); });
}
function calificar(id){
  const p = db.postulaciones.find(x=>x.id===id), u = yo(), emp = u.rol==="empresa";
  const otro = emp ? usuario(p.trabId) : usuario(vacante(p.vacId).empresaId);
  let est = 0;
  modal(`<h2>¿Cómo fue su experiencia con ${esc(otro.nombre)}?</h2><div class="estrellas" role="radiogroup" aria-label="Calificación">${[1,2,3,4,5].map(i=>`<button type="button" data-e="${i}" aria-label="${i} estrellas">★</button>`).join("")}</div>
    <div class="campo"><label for="rtxt">Comentario (opcional)</label><textarea id="rtxt"></textarea></div><button class="btn" id="env">Enviar calificación</button>`,
    m => { const bs = m.querySelectorAll("[data-e]");
      bs.forEach(b => b.onclick = () => { est = Number(b.dataset.e); bs.forEach(x => x.classList.toggle("on", Number(x.dataset.e) <= est)); });
      m.querySelector("#env").onclick = () => { if(!est) return toast("Elija de 1 a 5 estrellas.");
        db.resenas.push({para:otro.id,de:u.id,estrellas:est,texto:m.querySelector("#rtxt").value.trim()||"Sin comentario.",ts:Date.now()});
        if(emp) p.calEmp = est; else p.calTrab = est; guardar(); cerrarModal(); render(); toast("¡Gracias! Su calificación ya es visible."); }; });
}
render();
</script>
</body>
</html>
